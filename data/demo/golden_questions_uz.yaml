  - id: retail_14
    dataset: retail
    question: "Daromad oyma-oy qanday oʻzgardi?"
    expected_sql: >-
      WITH monthly AS (SELECT date_trunc('month', "sale_date") AS period, SUM("amount") FILTER (WHERE "payment_status" = 'paid') AS value FROM data WHERE "sale_date" IS NOT NULL GROUP BY 1 ORDER BY 1) SELECT period, value, 100.0 * (value - LAG(value) OVER (ORDER BY period)) / NULLIF(LAG(value) OVER (ORDER BY period), 0) AS mom_pct FROM monthly ORDER BY period
    router_expected: true
    intent: mom
    english: "What is the month-over-month change in revenue?"
