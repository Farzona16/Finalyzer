# Uzbek golden questions for Ask v2 (15 per demo dataset).
# expected_sql is produced by the deterministic compiler; result-set equality is the test.
questions:
  - id: retail_01
    dataset: retail
    question: "Jami daromad qancha?"
    expected_sql: >-
      SELECT SUM("amount") FILTER (WHERE "payment_status" = 'paid') AS "revenue" FROM data
    router_expected: true
    intent: total
    english: "What is the total revenue?"
  - id: retail_02
    dataset: retail
    question: "Daromad kategoriya boʻyicha qancha?"
    expected_sql: >-
      SELECT "category" AS "category", SUM("amount") FILTER (WHERE "payment_status" = 'paid') AS "revenue" FROM data WHERE "category" IS NOT NULL GROUP BY 1 ORDER BY 2 DESC NULLS LAST
    router_expected: true
    intent: by_dimension
    english: "What is the revenue by category?"
  - id: retail_03
    dataset: retail
    question: "Qaysi 5 ta doʻkon daromadi eng yuqori?"
    expected_sql: >-
      SELECT "store_name" AS "store_name", SUM("amount") FILTER (WHERE "payment_status" = 'paid') AS "revenue" FROM data WHERE "store_name" IS NOT NULL GROUP BY 1 ORDER BY 2 DESC NULLS LAST LIMIT 5
    router_expected: true
    intent: top_n
    english: "Which 5 stores have the highest revenue?"
  - id: retail_04
    dataset: retail
    question: "Daromad oylar boʻyicha qanday oʻzgardi?"
    expected_sql: >-
      SELECT date_trunc('month', "sale_date") AS period, SUM("amount") FILTER (WHERE "payment_status" = 'paid') AS value FROM data WHERE "sale_date" IS NOT NULL GROUP BY 1 ORDER BY 1
    router_expected: true
    intent: trend
    english: "Show the monthly revenue over time."
  - id: retail_05
    dataset: retail
    question: "2026-yil sentabrda daromad qancha boʻldi?"
    expected_sql: >-
      SELECT SUM("amount") FILTER (WHERE "payment_status" = 'paid') AS "revenue" FROM data WHERE "sale_date" >= DATE '2026-09-01' AND "sale_date" < DATE '2026-10-01'
    router_expected: true
    intent: period_value
    english: "What was the revenue in September 2026?"
  - id: retail_06
    dataset: retail
    question: "Oxirgi oyda daromad qancha?"
    expected_sql: >-
      SELECT SUM("amount") FILTER (WHERE "payment_status" = 'paid') AS "revenue" FROM data WHERE "sale_date" >= DATE '2026-09-01' AND "sale_date" < DATE '2026-10-01'
    router_expected: true
    intent: last_month
    english: "What was the revenue last month?"
  - id: retail_07
    dataset: retail
    question: "Oʻrtacha buyurtma summasi kanal boʻyicha qancha?"
    expected_sql: >-
      SELECT SUM("amount") / NULLIF(COUNT(DISTINCT "sale_id"), 0) AS "avg_order_value" FROM data
    router_expected: true
    intent: average
  - id: retail_08
    dataset: retail
    question: "Yalpi foyda ulushi kategoriya boʻyicha qancha?"
    expected_sql: >-
      WITH g AS (SELECT "category" AS category, 100.0 * (SUM("amount") - SUM("cost_amount")) / NULLIF(SUM("amount"), 0) AS value FROM data WHERE "category" IS NOT NULL GROUP BY 1) SELECT category, value, 100.0 * value / NULLIF(SUM(value) OVER (), 0) AS share_pct FROM g ORDER BY value DESC NULLS LAST
    router_expected: true
    intent: share
  - id: retail_09
    dataset: retail
    question: "2026 yilda nechta turli mijoz xarid qildi?"
    expected_sql: >-
      SELECT COUNT(DISTINCT "customer_id") AS n FROM data WHERE "sale_date" >= DATE '2026-01-01' AND "sale_date" < DATE '2027-01-01'
    router_expected: true
    intent: distinct
    english: "How many distinct customers bought in 2026?"
  - id: retail_10
    dataset: retail
    question: "Daromad oʻtgan yilga nisbatan qanday oʻzgardi?"
    expected_sql: >-
      WITH s AS (SELECT date_trunc('month', "sale_date") AS period, SUM("amount") FILTER (WHERE "payment_status" = 'paid') AS value FROM data WHERE "sale_date" IS NOT NULL GROUP BY 1 ORDER BY 1) SELECT cur.period AS period, cur.value AS value, prev.value AS previous_year_value, 100.0 * (cur.value - prev.value) / NULLIF(prev.value, 0) AS yoy_pct FROM s cur LEFT JOIN s prev ON prev.period = CAST(cur.period - INTERVAL 1 YEAR AS DATE) ORDER BY cur.period
    router_expected: true
    intent: yoy
    english: "What is the year-over-year revenue growth by month?"
  - id: retail_11
    dataset: retail
    question: "Qaysi doʻkon eng yaxshi natija koʻrsatdi?"
    expected_sql: >-
      SELECT "store_name" AS "store_name", SUM("amount") FILTER (WHERE "payment_status" = 'paid') AS "revenue" FROM data WHERE "store_name" IS NOT NULL GROUP BY 1 ORDER BY 2 DESC NULLS LAST LIMIT 1
    router_expected: true
