services:
  - type: web
    name: finalyzer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_MODE
        value: ephemeral
      - key: PRIVACY_MODE
        value: demo
      - key: LLM_MODE
        value: offline
      - key: APP_SECRET_KEY
        sync: false
      - key: APP_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
