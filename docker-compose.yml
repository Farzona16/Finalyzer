services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY}
      APP_MASTER_KEY: ${APP_MASTER_KEY:-}
      DATABASE_URL: postgresql+psycopg://finalyzer:finalyzer@db:5432/finalyzer
      STORAGE_MODE: ephemeral
      PRIVACY_MODE: demo
      LLM_MODE: offline
      FRONTEND_DIST: /app/frontend/dist
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finalyzer
      POSTGRES_PASSWORD: finalyzer
      POSTGRES_DB: finalyzer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finalyzer"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

volumes:
  pgdata:
